name: cli release

on:
  push:
    branches: [main]
    paths: [cli/**, agentboxd/**, lib/**, modules/**, package.json, package-lock.json]

jobs:
  release:
    # macOS, so the macOS binaries can be signed and one of them run before release.
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The CLI fetches its modules, and hosts their agentboxd, at the tag of its own version.
      - id: version
        run: |
          tag=v$(node -p 'require("./package.json").version')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || echo "new=true" >> "$GITHUB_OUTPUT"
      - if: steps.version.outputs.new == 'true'
        run: npm ci
      - if: steps.version.outputs.new == 'true'
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64; do
            npx bun build cli/main.ts --compile --target="bun-$target" --outfile "dist/agentbox-$target"
          done
          npx bun build agentboxd/main.ts --compile --target=bun-linux-x64 --outfile dist/agentboxd-linux-x64
          # Apple silicon runs signed binaries only; an ad hoc signature is enough.
          codesign --force --sign - dist/agentbox-darwin-arm64 dist/agentbox-darwin-x64
          dist/agentbox-darwin-arm64 --version
      - if: steps.version.outputs.new == 'true'
        run: gh release create "$TAG" dist/agentbox-* dist/agentboxd-linux-x64 --target "$GITHUB_SHA" --title "$TAG" --generate-notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
