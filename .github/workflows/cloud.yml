name: cloud

# Scenarios against a real Hetzner project and a real tailnet, both kept for tests only.
# The environment `cloud` holds their secrets and waits for a maintainer's approval;
# pull requests from forks never get them.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloud
  cancel-in-progress: false

jobs:
  spec:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: cloud
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.10.0
          tofu_wrapper: false
      # Temporary: shows why Tailscale refuses a tag, without printing the key.
      - continue-on-error: true
        run: |
          token=$(curl -fsS -d "client_id=$TAILSCALE_OAUTH_CLIENT_ID" -d "client_secret=$TAILSCALE_OAUTH_CLIENT_SECRET" https://api.tailscale.com/api/v2/oauth/token | jq -r .access_token)
          echo "devices visible: $(curl -fsS -H "Authorization: Bearer $token" https://api.tailscale.com/api/v2/tailnet/-/devices | jq '.devices | length')"
          for tag in tag:ci tag:agentbox; do
            curl -sS -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
              -d "{\"capabilities\":{\"devices\":{\"create\":{\"ephemeral\":true,\"preauthorized\":true,\"tags\":[\"$tag\"]}}},\"expirySeconds\":60}" \
              https://api.tailscale.com/api/v2/tailnet/-/keys | jq -c --arg tag "$tag" 'if .key then {tag: $tag, result: "created"} else {tag: $tag, error: .} end'
          done
      - uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci
      - run: npm ci
      - run: npm run build
      - run: sudo install -d -o 1000 -g 1000 /var/lib/agentbox
      - run: test/sweep
      - run: npm test -- --profile cloud
        env:
          AGENTBOX_E2E: "1"
          AGENTBOX_CLOUD: "1"
          AGENTBOX_MODULE_SOURCE: ${{ github.workspace }}/modules
      - if: always()
        run: test/sweep
