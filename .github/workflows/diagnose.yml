name: diagnose
# Temporary: why containers inside a session pod reach no network on a runner.
on:
  push:
    branches: [arch/sessions-on-k3s]
    paths: [.github/workflows/diagnose.yml]
jobs:
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: uname -r; lsb_release -ds; ip -4 addr | grep inet; docker network inspect bridge -f '{{(index .IPAM.Config 0).Subnet}}'
      - run: sudo sh modules/hetzner/provision.sh >/dev/null
      - run: |
          cat <<'YAML' | sudo k3s kubectl apply -f -
          apiVersion: v1
          kind: Pod
          metadata: {name: probe}
          spec:
            runtimeClassName: sysbox-runc
            hostUsers: false
            containers:
            - name: dind
              image: docker:dind
              env: [{name: DOCKER_TLS_CERTDIR, value: ""}]
          YAML
          sudo k3s kubectl wait --for=condition=Ready pod/probe --timeout=180s
          for i in $(seq 30); do sudo k3s kubectl exec probe -- docker info >/dev/null 2>&1 && break; sleep 2; done
      - run: |
          x() { echo "### $*"; sudo k3s kubectl exec probe -- sh -c "$*" 2>&1 | tail -25; }
          x 'cat /sys/class/net/eth0/mtu; ip -4 addr | grep inet'
          x 'iptables -V; iptables-legacy -V 2>/dev/null; ls -l $(which iptables)'
          x 'iptables -t nat -S | head -20'
          x 'iptables-legacy -t nat -S 2>/dev/null | head -20'
          x 'wget -q -T 10 -O /dev/null http://deb.debian.org/debian/ && echo POD-OK || echo POD-FAIL'
          x 'docker run --rm alpine wget -q -T 10 -O /dev/null http://deb.debian.org/debian/ && echo INNER-OK || echo INNER-FAIL'
          x 'docker run --rm --network host alpine wget -q -T 10 -O /dev/null http://deb.debian.org/debian/ && echo INNER-HOSTNET-OK || echo INNER-HOSTNET-FAIL'
          x 'cat /etc/resolv.conf; nslookup deb.debian.org 2>&1 | tail -6'
          x 'docker run --rm alpine sh -c "cat /etc/resolv.conf; time nslookup deb.debian.org 2>&1 | tail -6"'
          x 'docker run --rm alpine sh -c "time wget -q -T 15 -O /dev/null http://deb.debian.org/debian/; echo inner-exit=\$?"'
          x 'docker run --rm --dns 1.1.1.1 alpine sh -c "time wget -q -T 15 -O /dev/null http://deb.debian.org/debian/; echo inner-public-dns-exit=\$?"'
          echo "### node nat POSTROUTING"; sudo iptables -t nat -S POSTROUTING; sudo iptables -t nat -S FLANNEL-POSTRTG 2>/dev/null
          echo "### node routes"; ip route
          x 'ss -ltn | grep 2375 || echo no-2375'
          sudo k3s kubectl logs probe | grep -i -E "iptables|nat|error|warn" | tail -15
# rerun 1792953731
