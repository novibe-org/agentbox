name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.10.0
      - run: tofu fmt -check -recursive modules
      - run: for m in modules/*/; do tofu -chdir="$m" init -backend=false && tofu -chdir="$m" validate; done

  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: helm version --short && kubectl version --client
      - run: npm test
        env:
          AGENTBOX_E2E: "1"
